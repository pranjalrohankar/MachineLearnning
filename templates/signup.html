<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Attack Detection Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 160px);
            margin-top: 80px;
            background: transparent;
            box-shadow: none;
            border: none;
            padding: 20px;
        }

        .signin-card {
            background: rgba(30, 41, 59, 0.7);
            padding: 40px 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.5s ease-out;
        }

        .signin-card h2 {
            color: #F8FAFC;
            margin-bottom: 25px;
            font-size: 28px;
            font-family: 'Outfit', sans-serif;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.6);
            color: #F8FAFC;
            text-align: left;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3);
            border-color: #38BDF8;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #38BDF8;
            color: #0F172A;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
        }

        button[type="submit"]:hover {
            background: #F8FAFC;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <i class="fas fa-shield-alt"></i>
                <span>ThreatDetect AI</span>
            </a>
            <div class="nav-links">
                <a href="{{ url_for('login') }}" class="nav-link"><i class="fas fa-sign-in-alt"></i> Login</a>
                <a href="{{ url_for('register') }}" class="nav-link"><i class="fas fa-user-plus"></i> Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="signin-card">
            <h2>Create a New Account</h2>
            <form id="registrationForm" action="/register" method="POST">
                <input type="text" name="fullname" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="password" name="confirm-password" placeholder="Confirm Password" required>
                <button type="submit">Sign Up</button>

            </form>

            <div id="message"></div>
        </div>
    </div>

    <footer>
        &copy; 2025 Attack Detection Website | All Rights Reserved
    </footer>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const formObject = Object.fromEntries(formData.entries());
            const messageDiv = document.getElementById('message');

            // Check if passwords match
            if (formObject.password !== formObject['confirm-password']) {
                messageDiv.textContent = 'Passwords do not match!';
                messageDiv.style.color = 'red';
                return;
            }

            messageDiv.textContent = 'Processing...';
            messageDiv.style.color = 'white';

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams(formObject),
                });

                const result = await response.json();

                if (response.ok) {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = result.message || 'Registration successful!';
                    setTimeout(() => {
                        window.location.href = "/home";
                    }, 1000);
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = result.message || 'Registration failed.';
                }
            } catch (error) {
                console.error('Error:', error);
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'An error occurred. Please try again later.';
            }
        });
    </script>
</body>
</html>
